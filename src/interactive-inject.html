<script type="text/javascript">
  (function () {
    "use strict";

    // ── Utility ────────────────────────────────────────────────────────────────

    function clamp(v, min, max) {
      return Math.min(Math.max(v, min), max);
    }

    // ── On-canvas rendering ────────────────────────────────────────────────────
    //
    // Node-RED calls onrender(node) (via the `oneditprepare` hook on the editor
    // side and via the d3/SVG layer) but the proper hook for injecting custom
    // SVG into each node's group is `RED.nodes.registerType` with a `draw`
    // function in the `options` object (available since NR 3.1).
    //
    // We use RED.nodes.registerType's `draw` callback to embed a foreignObject
    // that hosts the <input type="range"> slider directly on the canvas.

    RED.nodes.registerType("interactive-inject", {
      category: "input",
      color: "#a6bbcf",
      defaults: {
        name:         { value: "" },
        label:        { value: "inject" },
        minValue:     { value: 0,   validate: RED.validators.number() },
        maxValue:     { value: 100, validate: RED.validators.number() },
        step:         { value: 1,   validate: RED.validators.number() },
        defaultValue: { value: 50,  validate: RED.validators.number() },
      },
      inputs: 0,
      outputs: 1,
      icon: "inject.svg",
      label: function () {
        return this.name || this.label || "interactive inject";
      },
      labelStyle: function () {
        return this.name ? "node_label_italic" : "";
      },

      // ── Canvas button (left-side trigger, like the built-in inject node) ────
      button: {
        onclick: function () {
          var node = this;
          $.ajax({
            url: "interactive-inject/" + node.id + "/inject",
            type: "POST",
            success: function (resp) {
              RED.notify(
                node.label() + ": injected " + resp.value,
                { type: "success", timeout: 1500 }
              );
            },
            error: function (jqXHR) {
              RED.notify(
                node.label() + ": " + (jqXHR.responseText || "error"),
                { type: "error", timeout: 3000 }
              );
            },
          });
        },
      },

      // ── SVG drawing hook ───────────────────────────────────────────────────
      // draw() is called by Node-RED after the node's SVG group is created.
      // `this` is the node object; `D3group` is the d3 selection of the <g>.
      draw: function (D3group) {
        var node = this;
        var W = 180; // node body width (px)
        var H = 42;  // slider area height (px)

        // foreignObject to host the native range input
        var fo = D3group.append("foreignObject")
          .attr("x", 5)
          .attr("y", 30)       // below the node label row
          .attr("width", W - 10)
          .attr("height", H);

        var body = fo.append("xhtml:div")
          .style("display", "flex")
          .style("align-items", "center")
          .style("gap", "6px")
          .style("height", "100%")
          .style("user-select", "none");

        var slider = body.append("xhtml:input")
          .attr("type", "range")
          .attr("min", node.minValue)
          .attr("max", node.maxValue)
          .attr("step", node.step)
          .attr("value", node.currentValue !== undefined ? node.currentValue : node.defaultValue)
          .style("flex", "1")
          .style("cursor", "pointer");

        var valueLabel = body.append("xhtml:span")
          .style("min-width", "32px")
          .style("font-size", "11px")
          .style("font-family", "monospace")
          .style("text-align", "right")
          .text(slider.node().value);

        slider.on("input", function () {
          var v = parseFloat(this.value);
          valueLabel.text(v);
          // Persist the live value on the node object so the button can send it
          node.currentValue = v;
          // Also tell the runtime about the new value without triggering output
          $.ajax({
            url: "interactive-inject/" + node.id + "/value",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ value: v }),
          });
        });

        // Stop d3 drag from interfering with the slider
        slider.on("mousedown", function (evt) {
          if (evt && evt.stopPropagation) evt.stopPropagation();
        });
      },

      // ── Edit dialog ────────────────────────────────────────────────────────
      oneditprepare: function () {
        $("#node-input-minValue").val(this.minValue);
        $("#node-input-maxValue").val(this.maxValue);
        $("#node-input-step").val(this.step);
        $("#node-input-defaultValue").val(this.defaultValue);
      },

      oneditsave: function () {
        this.minValue     = parseFloat($("#node-input-minValue").val());
        this.maxValue     = parseFloat($("#node-input-maxValue").val());
        this.step         = parseFloat($("#node-input-step").val());
        this.defaultValue = parseFloat($("#node-input-defaultValue").val());
        this.defaultValue = clamp(this.defaultValue, this.minValue, this.maxValue);
        // Reset live value to new default on save
        this.currentValue = this.defaultValue;
      },
    });
  })();
</script>

<!-- ── Edit dialog template ─────────────────────────────────────────────── -->
<script type="text/html" data-template-name="interactive-inject">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name (optional)">
  </div>
  <div class="form-row">
    <label for="node-input-label"><i class="fa fa-i-cursor"></i> Label</label>
    <input type="text" id="node-input-label" placeholder="inject">
  </div>
  <div class="form-row">
    <label for="node-input-minValue"><i class="fa fa-arrow-left"></i> Min</label>
    <input type="number" id="node-input-minValue" style="width:80px">
  </div>
  <div class="form-row">
    <label for="node-input-maxValue"><i class="fa fa-arrow-right"></i> Max</label>
    <input type="number" id="node-input-maxValue" style="width:80px">
  </div>
  <div class="form-row">
    <label for="node-input-step"><i class="fa fa-th"></i> Step</label>
    <input type="number" id="node-input-step" style="width:80px">
  </div>
  <div class="form-row">
    <label for="node-input-defaultValue"><i class="fa fa-sliders"></i> Default</label>
    <input type="number" id="node-input-defaultValue" style="width:80px">
  </div>
</script>

<!-- ── Help panel ──────────────────────────────────────────────────────── -->
<script type="text/html" data-help-name="interactive-inject">
  <p>An inject node with an inline slider rendered directly on the Node-RED canvas.</p>
  <h3>Usage</h3>
  <ul>
    <li>Drag the slider to pick a numeric value.</li>
    <li>Click the <strong>button</strong> on the left of the node to send <code>msg.payload</code> with the current slider value into the flow.</li>
  </ul>
  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Min <span class="property-type">number</span></dt>
    <dd>Minimum slider value (default 0).</dd>
    <dt>Max <span class="property-type">number</span></dt>
    <dd>Maximum slider value (default 100).</dd>
    <dt>Step <span class="property-type">number</span></dt>
    <dd>Increment between values (default 1).</dd>
    <dt>Default <span class="property-type">number</span></dt>
    <dd>Initial slider value.</dd>
  </dl>
  <h3>Output</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">number</span></dt>
    <dd>The current slider value at the moment the button is clicked.</dd>
  </dl>
</script>
