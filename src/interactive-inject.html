<style>
  #node-input-outputProperty { width: 70%; }
  #node-input-mode           { width: auto; }
  #node-input-autoCollapse   { width: auto; margin-right: 6px; }

  .nri-num-input { width: 120px; }

  .nri-section-row   { margin-bottom: 6px; align-items: center; }
  .nri-section-label { color: var(--red-ui-secondary-text-color, #888); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; width: auto; min-width: 0; margin-bottom: 0; }
  .nri-section-label i { margin-right: 5px; }

  .nri-send-row { align-items: flex-start; }
  .nri-radio-group { display: inline-flex; flex-direction: column; gap: 4px; padding-top: 2px; }
  .nri-radio-group > label { font-weight: normal; margin-bottom: 0; white-space: nowrap; }
  .nri-radio-group input[type="radio"] { width: auto; margin-right: 4px; }

  .nri-presets-row { margin-bottom: 8px; }
  .nri-hint { font-size: 11px; color: var(--red-ui-secondary-text-color, #888); }
</style>

<script type="text/javascript">
  (function () {
    "use strict";

    var SLIDER_H = 56;

    // Reposition node.status below the widget foreignObject.
    // The status group is NOT always inside evt.el — in Node-RED 4.x it lives in
    // the SVG group that D3 selects by node.id. We search both locations and
    // observe both with a MutationObserver + a setInterval fallback.
    // __nriY__ on the DOM element tracks what y we wrote, preventing double-shifts
    // when renderWidget re-runs while the status is already repositioned.
    function setupStatusReposition(el, foH) {
      if (el.__statusObs__) { el.__statusObs__.disconnect(); }
      if (el.__statusInt__) { clearInterval(el.__statusInt__); }

      function fix() {
        // Node-RED stores a direct reference to the status group on the node element.
        // Class is "red-ui-flow-node-status-group"; the transform is translate(x, h+3).
        var sg = el.__statusGroup__ || el.querySelector(".red-ui-flow-node-status-group");
        if (!sg) { return; }
        var cur = sg.getAttribute("transform") || "";
        var mx = cur.match(/translate\s*\(\s*([^,\s]+)[,\s]+([^)\s]+)/);
        if (!mx) { return; }
        var x = parseFloat(mx[1]);
        var y = parseFloat(mx[2]);
        if (sg.__nriY__ !== undefined && Math.abs(y - sg.__nriY__) < 0.5) { return; }
        sg.__nriY__ = y + foH;
        sg.setAttribute("transform", "translate(" + x + "," + sg.__nriY__ + ")");
      }

      fix();
      el.__statusObs__ = new MutationObserver(fix);
      el.__statusObs__.observe(el, { childList: true, subtree: true, attributes: true, attributeFilter: ["transform", "style"] });
      el.__statusInt__ = setInterval(fix, 500);
    }

    // Always update style content so upgrades are reflected without a hard refresh
    var nriStyle = document.getElementById("nri-style") || (function () {
      var el = document.createElement("style");
      el.id = "nri-style";
      document.head.appendChild(el);
      return el;
    })();
    nriStyle.textContent = [
      ".nri-val::-webkit-inner-spin-button,.nri-val::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}",
      ".nri-val{-moz-appearance:textfield;outline:none}",
      ".nri-val:focus{outline:2px solid #4aa3df;outline-offset:1px;border-radius:3px}",
    ].join("");

    // Auto-collapse: hides the widget 3s after the cursor leaves the node;
    // expands immediately when the cursor re-enters.
    // __nriCollapsed__ on the element persists the state across re-renders so that
    // Node-RED redrawing the node (e.g. on canvas click) does not reset it to expanded.
    function setupAutoCollapse(el, node, nodeH, foH) {
      if (el.__nriColTimer__)  { clearTimeout(el.__nriColTimer__); el.__nriColTimer__ = null; }
      if (el.__nriOnEnter__)   { el.removeEventListener("mouseenter", el.__nriOnEnter__); el.__nriOnEnter__ = null; }
      if (el.__nriOnLeave__)   { el.removeEventListener("mouseleave", el.__nriOnLeave__); el.__nriOnLeave__ = null; }
      if (!node.autoCollapse)  { el.__nriCollapsed__ = false; return; }

      var nodeW = Math.max(node.w || 100, 100);
      var origW = node.w || 100;

      function applyCollapsed(state) {
        el.__nriCollapsed__ = state;
        var fo = el.querySelector(".nri-fo");
        if (state) {
          if (fo) { fo.style.display = "none"; }
          if (el.__mainRect__) {
            el.__mainRect__.setAttribute("height", nodeH);
            el.__mainRect__.setAttribute("width", origW);
          }
          if (el.__statusObs__) { el.__statusObs__.disconnect(); el.__statusObs__ = null; }
          if (el.__statusInt__) { clearInterval(el.__statusInt__); el.__statusInt__ = null; }
          var sg = el.__statusGroup__ || el.querySelector(".red-ui-flow-node-status-group");
          if (sg && sg.__nriY__ !== undefined) {
            var cur = sg.getAttribute("transform") || "";
            var xm = cur.match(/translate\s*\(\s*([^,\s]+)/);
            var sx = xm ? parseFloat(xm[1]) : 3;
            delete sg.__nriY__;
            sg.setAttribute("transform", "translate(" + sx + "," + (nodeH + 3) + ")");
          }
        } else {
          if (fo) { fo.style.display = ""; }
          if (el.__mainRect__) {
            el.__mainRect__.setAttribute("height", nodeH + foH);
            el.__mainRect__.setAttribute("width", nodeW);
          }
          setupStatusReposition(el, foH);
        }
      }

      // Re-render may have produced a visible fo even though we were collapsed —
      // reapply the persisted state immediately.
      if (el.__nriCollapsed__) { applyCollapsed(true); }

      el.__nriOnEnter__ = function () {
        clearTimeout(el.__nriColTimer__); el.__nriColTimer__ = null;
        applyCollapsed(false);
      };
      el.__nriOnLeave__ = function () {
        el.__nriColTimer__ = setTimeout(function () { applyCollapsed(true); }, 3000);
      };
      el.addEventListener("mouseenter", el.__nriOnEnter__);
      el.addEventListener("mouseleave", el.__nriOnLeave__);
      // Only start the initial countdown when not already collapsed
      if (!el.__nriCollapsed__) {
        el.__nriColTimer__ = setTimeout(function () { applyCollapsed(true); }, 3000);
      }
    }

    function renderSlider(el, node) {
      var nodeH = node.h || 30;
      var nodeW = Math.max(node.w || 100, 100);
      if (el.__mainRect__) {
        el.__mainRect__.setAttribute("height", nodeH + SLIDER_H);
        el.__mainRect__.setAttribute("width", nodeW);
      }
      setupStatusReposition(el, SLIDER_H);

      var old = el.querySelector(".nri-fo");
      if (old) { old.remove(); }

      var initVal = node.currentValue !== undefined
        ? node.currentValue
        : (node.defaultValue !== undefined ? node.defaultValue : 50);

      var fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
      fo.setAttribute("class", "nri-fo");
      fo.setAttribute("x", "5");
      fo.setAttribute("y", String(nodeH + 2));
      fo.setAttribute("width", String(nodeW - 10));
      fo.setAttribute("height", String(SLIDER_H - 2));

      var wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;align-items:stretch;gap:4px;height:100%;padding:2px 0;box-sizing:border-box";

      // Editable value input — class handles spin-button removal and :focus ring
      var valueDisplay = document.createElement("input");
      valueDisplay.type = "number";
      valueDisplay.className = "nri-val";
      valueDisplay.value = String(initVal);
      valueDisplay.style.cssText = [
        "text-align:center",
        "font-size:12px",
        "font-weight:600",
        "font-family:monospace",
        "line-height:18px",
        "color:var(--red-ui-node-label-color,#333)",
        "background:rgba(0,0,0,0.12)",
        "border-radius:3px",
        "border:none",
        "width:100%",
        "box-sizing:border-box",
        "pointer-events:all",
        "cursor:text",
        "padding:0",
      ].join(";");

      var slider = document.createElement("input");
      slider.type = "range";
      slider.min   = String(node.minValue  !== undefined ? node.minValue  : 0);
      slider.max   = String(node.maxValue  !== undefined ? node.maxValue  : 100);
      slider.step  = String(node.step      !== undefined ? node.step      : 1);
      slider.value = String(initVal);
      slider.style.cssText = "width:100%;cursor:pointer;pointer-events:all;margin:0;user-select:none;-webkit-user-select:none";
      slider.setAttribute("aria-label", "slider value");
      slider.setAttribute("aria-valuemin", slider.min);
      slider.setAttribute("aria-valuemax", slider.max);

      var persistTimer;
      function persistValue(v) {
        node.currentValue = v;
        RED.nodes.dirty(true);
        clearTimeout(persistTimer);
        persistTimer = setTimeout(function () {
          $.ajax({
            url: "interactive-inject/" + node.id + "/value",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ value: v }),
          });
        }, 150);
      }

      function commitTyped() {
        var v = parseFloat(valueDisplay.value);
        if (isNaN(v)) { valueDisplay.value = String(node.currentValue); return; }
        v = Math.min(Math.max(v, parseFloat(slider.min)), parseFloat(slider.max));
        valueDisplay.value = String(v);
        slider.value = String(v);
        persistValue(v);
      }

      // Safari miscalculates range-input values inside SVG foreignObject (wrong
      // coordinate space). We bypass the native slider entirely:
      //  • pointerdown on slider: preventDefault (stops Safari's broken calc +
      //    suppresses synthetic mouse events) then setPointerCapture on wrap — a
      //    plain div, because Safari's pointer capture is unreliable on form elements.
      //  • pointermove / pointerup on wrap: compute value from e.clientX vs
      //    slider.getBoundingClientRect(), which is always in client coordinates.
      var sliderBehaviour = node.sliderBehaviour || (node.injectOnRelease === false ? "none" : "release");
      var dragging = false;
      var lastInjectedValue = initVal;

      function sliderValueFromPointer(clientX) {
        var rect = slider.getBoundingClientRect();
        var min = parseFloat(slider.min);
        var max = parseFloat(slider.max);
        var step = parseFloat(slider.step) || 1;
        var pct = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
        var raw = min + pct * (max - min);
        var stepped = parseFloat((Math.round((raw - min) / step) * step + min).toPrecision(10));
        return Math.min(Math.max(stepped, min), max);
      }

      function applySliderValue(v) {
        slider.value = String(v);
        valueDisplay.value = String(v);
        persistValue(v);
      }

      function injectValue(v) {
        lastInjectedValue = v;
        $.ajax({
          url: "interactive-inject/" + node.id + "/inject",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({ value: v }),
        });
      }

      slider.addEventListener("pointerdown", function (e) {
        e.stopPropagation();
        e.preventDefault();
        wrap.setPointerCapture(e.pointerId);
        dragging = true;
        var v = sliderValueFromPointer(e.clientX);
        applySliderValue(v);
        if (sliderBehaviour === "drag" && v !== lastInjectedValue) { injectValue(v); }
      });

      wrap.addEventListener("pointermove", function (e) {
        if (!dragging) { return; }
        var v = sliderValueFromPointer(e.clientX);
        applySliderValue(v);
        if (sliderBehaviour === "drag" && v !== lastInjectedValue) { injectValue(v); }
      });

      wrap.addEventListener("pointerup", function (e) {
        if (!dragging) { return; }
        dragging = false;
        var v = sliderValueFromPointer(e.clientX);
        applySliderValue(v);
        if (sliderBehaviour === "release") { injectValue(v); }
      });

      wrap.addEventListener("pointercancel", function () { dragging = false; });

      // Keyboard navigation (arrow keys) still fires native input/change events
      // because preventDefault on pointerdown does not affect keyboard events.
      slider.addEventListener("input", function () {
        if (dragging) { return; }
        var v = parseFloat(this.value);
        valueDisplay.value = String(v);
        persistValue(v);
      });

      slider.addEventListener("change", function () {
        if (dragging || sliderBehaviour === "none") { return; }
        injectValue(parseFloat(this.value));
      });

      // Stop all pointer events on the foreignObject so Node-RED's canvas click handler
      // never fires (which would select the node and tear down the foreignObject).
      ["mousedown","mouseup","click","pointerdown","pointerup"].forEach(function (type) {
        fo.addEventListener(type, function (e) { e.stopPropagation(); });
      });

      valueDisplay.addEventListener("mousedown", function (e) {
        e.preventDefault(); // prevent D3 drag from blocking native focus
        this.focus();
      });
      valueDisplay.addEventListener("keydown", function (e) {
        e.stopPropagation();
        if (e.key === "Enter") {
          commitTyped();
          if (sliderBehaviour !== "none") {
            injectValue(parseFloat(valueDisplay.value));
          }
          this.blur();
        } else if (e.key === "Escape") {
          valueDisplay.value = String(node.currentValue);
          this.blur();
        }
      });
      valueDisplay.addEventListener("blur", commitTyped);

      wrap.appendChild(valueDisplay);
      wrap.appendChild(slider);
      fo.appendChild(wrap);
      el.appendChild(fo);
      setupAutoCollapse(el, node, nodeH, SLIDER_H);
    }

    function renderPresets(el, node) {
      var old = el.querySelector(".nri-fo");
      if (old) { old.remove(); }

      var nodeW = Math.max(node.w || 100, 100);
      var nodeH = node.h || 30;
      var presets = node.presets || [];

      function fmtVal(v) {
        if (v === null || v === undefined) { return ""; }
        var s = typeof v === "object" ? JSON.stringify(v) : String(v);
        return s.length > 28 ? s.slice(0, 28) + "…" : s;
      }
      function fmtPreset(p) {
        switch (p.valueType) {
          case "date":    return "timestamp";
          case "bin":     return "buffer";
          case "env":     return "$" + (p.value || "");
          case "flow":    return "flow." + (p.value || "");
          case "global":  return "global." + (p.value || "");
          case "jsonata": { var e = String(p.value || ""); return "ƒ(" + (e.length > 18 ? e.slice(0, 18) + "…" : e) + ")"; }
          default:        return fmtVal(p.value);
        }
      }

      // Estimate rows needed so the widget grows to fit wrapped buttons
      var availW = nodeW - 14;
      var rows = 1;
      if (presets.length > 0) {
        var rowX = 0;
        presets.forEach(function (p, i) {
          var bw = Math.max(26, (p.label || fmtPreset(p)).length * 7 + 14);
          if (i === 0) { rowX = bw; }
          else if (rowX + 3 + bw > availW) { rows++; rowX = bw; }
          else { rowX += 3 + bw; }
        });
      }
      var foH = Math.max(SLIDER_H, 8 + rows * 26 + (rows - 1) * 3 + 16);

      if (el.__mainRect__) {
        el.__mainRect__.setAttribute("height", nodeH + foH);
        el.__mainRect__.setAttribute("width", nodeW);
      }
      setupStatusReposition(el, foH);

      var fo = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
      fo.setAttribute("class", "nri-fo");
      fo.setAttribute("x", "5");
      fo.setAttribute("y", String(nodeH + 2));
      fo.setAttribute("width", String(nodeW - 10));
      fo.setAttribute("height", String(foH - 2));

      var wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;gap:2px;padding:4px 0 2px;box-sizing:border-box;height:100%;overflow:hidden";

      if (presets.length === 0) {
        var hint = document.createElement("span");
        hint.textContent = "No presets — open editor to add";
        hint.style.cssText = "font-size:10px;color:rgba(0,0,0,0.4);font-style:italic;align-self:center;width:100%;text-align:center;margin-top:10px";
        wrap.appendChild(hint);
      } else {
        var btnRow = document.createElement("div");
        btnRow.style.cssText = "display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start";

        var statusDiv = document.createElement("div");
        statusDiv.style.cssText = [
          "font-size:10px",
          "color:rgba(0,0,0,0.45)",
          "line-height:14px",
          "white-space:nowrap",
          "overflow:hidden",
          "text-overflow:ellipsis",
          "padding:0 1px",
          "min-height:14px",
          "font-style:italic",
        ].join(";");

        var buttons = [];

        function applySelection(selectedIdx) {
          node.lastPresetIndex = selectedIdx;
          buttons.forEach(function (b, j) {
            if (j === selectedIdx) {
              b.style.border = "2px solid #4aa3df";
              b.style.boxShadow = "0 0 0 1px rgba(74,163,223,0.3)";
            } else {
              b.style.border = "1px solid rgba(0,0,0,0.25)";
              b.style.boxShadow = "none";
            }
          });
        }

        presets.forEach(function (preset, i) {
          var btn = document.createElement("button");
          btn.textContent = preset.label || fmtPreset(preset);
          btn.style.cssText = [
            "font-size:11px",
            "font-weight:600",
            "padding:3px 7px",
            "border:1px solid rgba(0,0,0,0.25)",
            "border-radius:4px",
            "background:rgba(0,0,0,0.12)",
            "color:var(--red-ui-node-label-color,#333)",
            "cursor:pointer",
            "pointer-events:all",
            "user-select:none",
            "-webkit-user-select:none",
            "min-width:26px",
            "line-height:18px",
            "flex-shrink:0",
            "box-sizing:border-box",
          ].join(";");

          buttons.push(btn);

          btn.addEventListener("mouseenter", (function (idx) {
            return function () {
              var _p = presets[idx];
              statusDiv.textContent = _p.label
                ? _p.label + ": " + fmtPreset(_p)
                : fmtPreset(_p);
            };
          })(i));
          btn.addEventListener("mouseleave", function () { statusDiv.textContent = ""; });
          btn.addEventListener("mousedown", function (e) { e.stopPropagation(); });
          btn.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
          btn.addEventListener("click", (function (idx) {
            return function (e) {
              e.stopPropagation();
              applySelection(idx);
              $.ajax({
                url: "interactive-inject/" + node.id + "/preset",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ index: idx }),
              });
            };
          })(i));

          btnRow.appendChild(btn);
        });

        // Restore button selection across redraws
        if (typeof node.lastPresetIndex === "number" && node.lastPresetIndex < presets.length) {
          applySelection(node.lastPresetIndex);
        }

        wrap.appendChild(btnRow);
        wrap.appendChild(statusDiv);
      }

      ["mousedown","mouseup","click","pointerdown","pointerup"].forEach(function (type) {
        fo.addEventListener(type, function (e) { e.stopPropagation(); });
      });

      fo.appendChild(wrap);
      el.appendChild(fo);
      setupAutoCollapse(el, node, nodeH, foH);
    }

    function renderWidget(el, node) {
      if (node.mode === "presets") {
        renderPresets(el, node);
      } else {
        renderSlider(el, node);
      }
    }

    RED.nodes.registerType("interactive-inject", {
      category: "common",
      color: "#a6bbcf",
      defaults: {
        name:            { value: "" },
        topic:           { value: "" },
        outputProperty:  { value: "payload" },
        mode:            { value: "slider" },
        minValue:        { value: 0,   validate: RED.validators.number() },
        maxValue:        { value: 100, validate: RED.validators.number() },
        step:            { value: 1,   validate: RED.validators.number() },
        defaultValue:    { value: 50,  validate: RED.validators.number() },
        currentValue:    { value: undefined },
        sliderBehaviour: { value: null },
        injectOnRelease: { value: true },
        autoCollapse:    { value: false },
        presets:         { value: [] },
        outputAsJsonata: { value: false },
        outputJsonata:   { value: '$value' },
      },
      inputs: 0,
      outputs: 1,
      icon: "inject.svg",
      label: function () {
        return this.name || "";
      },
      labelStyle: function () {
        return this.name ? "node_label_italic" : "";
      },

      button: {
        onclick: function () {
          var node = this;
          var displayLabel = node.name || node.label || "interactive inject";
          if (node.mode === "presets") {
            if (!node.presets || node.presets.length === 0) { return; }
            var idx = typeof node.lastPresetIndex === "number"
              ? Math.min(node.lastPresetIndex, node.presets.length - 1)
              : 0;
            $.ajax({
              url: "interactive-inject/" + node.id + "/preset",
              type: "POST",
              contentType: "application/json",
              data: JSON.stringify({ index: idx }),
              success: function (resp) {
                RED.notify(
                  displayLabel + ': injected "' + resp.label + '"',
                  { type: "success", timeout: 1500 }
                );
              },
              error: function (jqXHR) {
                RED.notify(
                  displayLabel + ": " + (jqXHR.responseText || "error"),
                  { type: "error", timeout: 3000 }
                );
              },
            });
            return;
          }
          $.ajax({
            url: "interactive-inject/" + node.id + "/inject",
            type: "POST",
            success: function (resp) {
              RED.notify(
                displayLabel + ": injected " + resp.value,
                { type: "success", timeout: 1500 }
              );
            },
            error: function (jqXHR) {
              RED.notify(
                displayLabel + ": " + (jqXHR.responseText || "error"),
                { type: "error", timeout: 3000 }
              );
            },
          });
        },
      },

      oneditprepare: function () {
        var node = this;

        function updateModeVisibility() {
          var m = $("#node-input-mode").val();
          if (m === "presets") {
            $("#nri-slider-section").hide();
            $("#nri-presets-section").show();
          } else {
            $("#nri-slider-section").show();
            $("#nri-presets-section").hide();
          }
        }

        $("#node-input-mode").val(this.mode || "slider").on("change", updateModeVisibility);
        updateModeVisibility();

        $("#node-input-topic").val(this.topic || "");
        $("#node-input-outputProperty").typedInput({ types: ["msg"] });
        $("#node-input-outputProperty").typedInput("value", this.outputProperty || "payload");
        $("#node-input-minValue").val(this.minValue);
        $("#node-input-maxValue").val(this.maxValue);
        $("#node-input-step").val(this.step);
        $("#node-input-defaultValue").val(this.defaultValue);
        var behaviour = node.sliderBehaviour || (node.injectOnRelease === false ? "none" : "release");
        $("input[name='nri-slider-behaviour'][value='" + behaviour + "']").prop("checked", true);
        $("#node-input-autoCollapse").prop("checked", this.autoCollapse === true);

        $("#node-input-outputJsonata").typedInput({ types: ["jsonata"] });
        $("#node-input-outputJsonata").typedInput("value", this.outputJsonata || "$value");
        var outputMode = this.outputAsJsonata ? "jsonata" : "raw";
        $("input[name='nri-slider-output-mode'][value='" + outputMode + "']").prop("checked", true);
        function updateOutputModeVisibility() {
          var jsonataSelected = $("input[name='nri-slider-output-mode']:checked").val() === "jsonata";
          $("#nri-slider-jsonata-row, #nri-slider-jsonata-hint-row").toggle(jsonataSelected);
        }
        $("input[name='nri-slider-output-mode']").on("change", updateOutputModeVisibility);
        updateOutputModeVisibility();

        $("#node-input-presets-list").editableList({
          addItem: function (container, i, data) {
            var row = $("<div>").css({ display: "flex", gap: "0", alignItems: "center", width: "100%" });
            var labelIn = $('<input type="text">')
              .addClass("nri-preset-label")
              .attr("placeholder", "auto")
              .css({ width: "90px", flex: "none", borderRadius: "3px 0 0 3px", borderRight: "none", boxSizing: "border-box" })
              .val(data.label || "");
            var sep = $('<span>').css({
              display: "inline-flex", alignItems: "center", justifyContent: "center",
              width: "22px", flexShrink: "0",
              background: "var(--red-ui-secondary-background-color, #f0f0f0)",
              border: "1px solid var(--red-ui-form-input-border-color, #ccc)",
              borderLeft: "none", borderRight: "none",
              color: "var(--red-ui-secondary-text-color, #888)",
              fontSize: "11px", lineHeight: "1", alignSelf: "stretch",
              userSelect: "none"
            }).text("→");
            var valueWrap = $("<div>").css({ flex: "1", minWidth: "0" });
            var valueIn = $('<input type="text">').addClass("nri-preset-value").css({ width: "100%", boxSizing: "border-box" });
            valueWrap.append(valueIn);
            var fullMsgWrap = $("<div>").css({ display: "none", alignItems: "center", gap: "3px", marginLeft: "6px", flex: "none", whiteSpace: "nowrap" });
            var fullMsgCheck = $('<input type="checkbox">').addClass("nri-preset-fullmsg").attr("title", "Send as full message object");
            var fullMsgLabel = $("<label>").css({ fontSize: "11px", color: "var(--red-ui-secondary-text-color,#888)", cursor: "pointer", marginBottom: "0" }).text("full msg");
            fullMsgWrap.append(fullMsgCheck).append(fullMsgLabel);
            row.append(labelIn).append(sep).append(valueWrap).append(fullMsgWrap);
            container.append(row);

            valueIn.typedInput({ types: ["flow", "global", "str", "num", "bool", "json", "bin", "date", "jsonata", "env"] });
            // typedInput wraps the input in a .red-ui-typedInput-container; round only the right corners
            // so it visually connects to the separator on the left
            valueIn.typedInput("widget").css({ borderRadius: "0 3px 3px 0" });

            function updateFullMsgVisibility() {
              var t = valueIn.typedInput("type");
              if (t === "json" || t === "jsonata") {
                fullMsgWrap.css("display", "flex");
              } else {
                fullMsgWrap.hide();
                fullMsgCheck.prop("checked", false);
              }
            }
            valueIn.on("change", updateFullMsgVisibility);

            if (data.valueType) {
              valueIn.typedInput("type", data.valueType);
            }
            if (data.value !== undefined) {
              var stored = (data.value !== null && typeof data.value === "object")
                ? JSON.stringify(data.value)
                : String(data.value);
              valueIn.typedInput("value", stored);
            }
            updateFullMsgVisibility();
            if (data.fullMsg) { fullMsgCheck.prop("checked", true); }
          },
          removable: true,
          sortable: true,
        });

        (node.presets || []).forEach(function (p) {
          $("#node-input-presets-list").editableList("addItem", p);
        });

      },

      oneditsave: function () {
        this.mode            = $("#node-input-mode").val();
        this.topic           = $("#node-input-topic").val();
        this.outputProperty  = $("#node-input-outputProperty").typedInput("value") || "payload";
        this.minValue        = parseFloat($("#node-input-minValue").val());
        this.maxValue        = parseFloat($("#node-input-maxValue").val());
        this.step            = parseFloat($("#node-input-step").val());
        this.defaultValue    = parseFloat($("#node-input-defaultValue").val());
        this.defaultValue    = Math.min(
          Math.max(this.defaultValue, this.minValue),
          this.maxValue
        );
        this.sliderBehaviour = $("input[name='nri-slider-behaviour']:checked").val() || "release";
        this.autoCollapse    = $("#node-input-autoCollapse").is(":checked");
        this.currentValue    = this.defaultValue;
        this.outputAsJsonata = $("input[name='nri-slider-output-mode']:checked").val() === "jsonata";
        this.outputJsonata   = $("#node-input-outputJsonata").typedInput("value") || "$value";

        var presets = [];
        $("#node-input-presets-list").editableList("items").each(function () {
          var labelIn = $(this).find(".nri-preset-label");
          var valueIn = $(this).find(".nri-preset-value");
          var fullMsg = $(this).find(".nri-preset-fullmsg").is(":checked");
          var typeStr = valueIn.typedInput("type");
          var rawVal  = valueIn.typedInput("value");
          var label   = String(labelIn.val());
          var item = { label: label, value: rawVal, valueType: typeStr };
          if (fullMsg) { item.fullMsg = true; }
          presets.push(item);
        });
        this.presets = presets;
      },
    });

    function onNodeDraw(evt) {
      if (evt.node.type === "interactive-inject") {
        renderWidget(evt.el, evt.node);
      }
    }

    RED.hooks.add("viewRedrawNode.interactive-inject", onNodeDraw);
    RED.hooks.add("viewAddNode.interactive-inject", onNodeDraw);

  })();
</script>

<script type="text/html" data-template-name="interactive-inject">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name (optional)">
  </div>
  <div class="form-row">
    <label for="node-input-topic"><i class="fa fa-tasks"></i> Topic</label>
    <input type="text" id="node-input-topic" placeholder="msg.topic (optional)">
  </div>
  <div class="form-row">
    <label for="node-input-outputProperty"><i class="fa fa-sign-out"></i> Property</label>
    <input type="text" id="node-input-outputProperty">
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-th-large"></i> Mode</label>
    <select id="node-input-mode">
      <option value="slider">Slider</option>
      <option value="presets">Preset buttons</option>
    </select>
  </div>

  <div id="nri-slider-section">
    <div class="form-row nri-section-row">
      <label class="nri-section-label"><i class="fa fa-sliders"></i>Slider range</label>
    </div>
    <div class="form-row">
      <label for="node-input-minValue"><i class="fa fa-minus"></i> Min</label>
      <input type="number" id="node-input-minValue" step="any" class="nri-num-input">
    </div>
    <div class="form-row">
      <label for="node-input-maxValue"><i class="fa fa-plus"></i> Max</label>
      <input type="number" id="node-input-maxValue" step="any" class="nri-num-input">
    </div>
    <div class="form-row">
      <label for="node-input-step"><i class="fa fa-arrows-h"></i> Step</label>
      <input type="number" id="node-input-step" step="any" min="0" class="nri-num-input">
    </div>
    <div class="form-row">
      <label for="node-input-defaultValue"><i class="fa fa-sliders"></i> Default</label>
      <input type="number" id="node-input-defaultValue" step="any" class="nri-num-input">
    </div>
    <div class="form-row nri-send-row">
      <label><i class="fa fa-paper-plane-o"></i> Send</label>
      <div class="nri-radio-group">
        <label><input type="radio" name="nri-slider-behaviour" value="release">on release</label>
        <label><input type="radio" name="nri-slider-behaviour" value="drag">while dragging (on change)</label>
        <label><input type="radio" name="nri-slider-behaviour" value="none">never (button only)</label>
      </div>
    </div>
    <div class="form-row nri-send-row">
      <label><i class="fa fa-code"></i> Output</label>
      <div class="nri-radio-group">
        <label><input type="radio" name="nri-slider-output-mode" value="raw">raw value</label>
        <label><input type="radio" name="nri-slider-output-mode" value="jsonata">JSONata expression</label>
      </div>
    </div>
    <div class="form-row" id="nri-slider-jsonata-row">
      <label for="node-input-outputJsonata">&nbsp;</label>
      <input type="text" id="node-input-outputJsonata" style="width:70%">
    </div>
    <div class="form-row" id="nri-slider-jsonata-hint-row">
      <span class="nri-hint">The slider value is available as <code>$value</code>. The result is written to the <em>Property</em> field above.</span>
    </div>
  </div>

  <div id="nri-presets-section">
    <div class="form-row nri-section-row">
      <label class="nri-section-label"><i class="fa fa-th"></i>Preset buttons</label>
    </div>
    <div class="form-row nri-presets-row">
      <ol id="node-input-presets-list"></ol>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-autoCollapse"><i class="fa fa-compress"></i> Auto-collapse</label>
    <input type="checkbox" id="node-input-autoCollapse">
    <span class="nri-hint">collapse after 3s of inactivity, expand on hover</span>
  </div>
</script>

<script type="text/html" data-help-name="interactive-inject">
  <p>An inject node with an inline widget rendered directly on the Node-RED canvas — either a numeric slider or a set of configurable preset buttons. No dashboard required.</p>
  <h3>Modes</h3>
  <dl class="message-properties">
    <dt>Slider</dt>
    <dd>Drag the range slider or type a value directly to pick a number. The <em>Send</em> option controls when injection happens: <strong>on release</strong> injects once when you let go (or press <strong>Enter</strong>); <strong>while dragging</strong> injects continuously as the value changes during drag (and on Enter); <strong>never</strong> disables automatic injection so only the left-side button triggers it. Press <strong>Escape</strong> to cancel a typed edit. The <em>Output</em> option controls what gets written to the <em>Property</em> field: <strong>raw value</strong> sends the plain number (default); <strong>JSONata expression</strong> evaluates a JSONata expression with the slider value bound to <code>$value</code>, letting you shape the payload — e.g. <code>{ "/Soc": $value }</code>.</dd>
    <dt>Preset buttons</dt>
    <dd>Each button is configured with a label and a typed value (string, number, boolean, JSON, JSONata, …). Hovering a button previews its value; clicking injects it. If a label is left blank it defaults to the value string.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">number | string | boolean | object</span></dt>
    <dd>The injected value, written to the property configured in the <em>Property</em> field (default: <code>msg.payload</code>).</dd>
    <dt>topic <span class="property-type">string</span></dt>
    <dd>The topic configured in the edit panel (empty string if not set).</dd>
    <dt>label <span class="property-type">string</span></dt>
    <dd><em>Preset buttons mode only.</em> The label of the clicked button. Also available as the variable <code>label</code> inside JSONata preset values.</dd>
  </dl>
  <h3>Details</h3>
  <p><strong>Configurable output property</strong> — by default the value is placed on <code>msg.payload</code>. Change the <em>Property</em> field to write to any message property, including nested paths such as <code>data.value</code>.</p>
  <p><strong>Full message output</strong> (preset buttons) — tick the <em>full msg</em> checkbox on a preset to send the evaluated result as the entire message object instead of a single property. The value type should be JSON or JSONata returning an object.</p>
  <p><strong>Node status</strong> — after each injection the last injected value is shown below the node using the standard Node-RED status indicator.</p>
  <p><strong>Auto-collapse</strong> — when enabled in the edit panel, the widget collapses to the normal node height 3 seconds after the cursor leaves the node, and re-expands immediately on hover.</p>
  <p>The left-side button injects the current slider value or the last-selected preset at any time, identical to the built-in Inject node.</p>
</script>
